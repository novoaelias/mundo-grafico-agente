<!doctype html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block titulo %}Panel{% endblock %} · Mundo Gráfico</title>
  <link rel="stylesheet" href="/panel/estaticos/estilos.css">
  <script src="/panel/estaticos/htmx.min.js"></script>
</head>
<body>
  <header class="topbar">
    <div class="marca">🖨️ Mundo Gráfico</div>
    <nav>
      <a href="/panel/pedidos" class="{{ 'activo' if seccion == 'pedidos' else '' }}">Pedidos</a>
      <a href="/panel/catalogo" class="{{ 'activo' if seccion == 'catalogo' else '' }}">Catálogo</a>
      <a href="/panel/taller" class="{{ 'activo' if seccion == 'taller' else '' }}">Taller</a>
    </nav>
  </header>
  <main>
    {% block contenido %}{% endblock %}
  </main>
</body>
</html>
